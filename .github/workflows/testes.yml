# Testes automáticos a cada push na main e em todo pull request.
# Backend: JUnit contra um Postgres descartável (mesmos dados de acesso do docker-compose.test.yml;
# os testes se recusam a rodar contra qualquer outro banco). Front: Vitest e o build de produção.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21, Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: retificas_test
          POSTGRES_USER: retificas
          POSTGRES_PASSWORD: retificas_teste
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U retificas -d retificas_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5544/retificas_test
      DATABASE_USER: retificas
      DATABASE_PASSWORD: retificas_teste
      SSL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes do backend
        run: mvn -B -pl core,backend -am test

  frontend:
    name: Front (Angular 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Testes do front
        run: npm test -- --watch=false
      - name: Build de produção
        run: npm run build
