# PORT: injetada pelo Railway em produção; local usa 8443.
server.port=${PORT:8443}
# Escuta em todas as interfaces de rede (0.0.0.0) para o celular acessar via Wi-Fi.
server.address=0.0.0.0
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/
# Redirecionamentos com Location relativo ("/"): atras do retifica-wake-proxy o Host
# que chega e o interno (retifica-backend.railway.internal) e o esquema e http, entao um
# Location absoluto mandava o navegador para um endereco que nao abre (ex.: /novo/ -> /).
server.tomcat.use-relative-redirects=true

# Compressao gzip das respostas (app.js, style.css e o JSON das APIs viajam
# sem compressao por padrao no Spring Boot) - reduz bastante o tempo de
# carregamento em conexao movel/lenta.
server.compression.enabled=true
# text/javascript: é como o Spring Boot 4 serve .js (RFC 9239) — sem ele, JS
# nunca era comprimido aqui (só a borda do Railway comprimia).
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# Pool de threads do Tomcat: o default (200) reserva memoria de pilha por
# thread conforme a demanda sobe, mas essa app é de uma oficina só (tráfego
# baixo, sem motivo pra reservar espaço pra 200 requisições simultâneas).
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

# HTTPS com certificado autoassinado — necessario localmente para o
# navigator.share() (compartilhar PDF) funcionar no celular via LAN/tunel;
# navegadores exigem contexto seguro. Em produção (Railway) o proprio PaaS
# termina o HTTPS de verdade na borda e fala HTTP puro com o container por
# dentro — por isso SSL_ENABLED=false fica setado la nas variaveis de ambiente.
# Ao acessar localmente pela primeira vez o navegador vai avisar que o
# certificado nao e confiavel: e esperado (autoassinado, so para testes
# locais) - toque em "Avancado" > "Continuar mesmo assim" / "Visitar site".
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=retifica123
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=retifica

# Upload do PDF do orçamento (com a foto embutida) pro envio pelo WhatsApp —
# o padrão do Spring (1MB) cortaria um orçamento com foto.
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB
