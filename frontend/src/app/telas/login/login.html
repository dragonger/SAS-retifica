<div class="login">
  <h2 class="titulo login-marca">Retífica</h2>
  <div class="login-regua" aria-hidden="true"></div>
  <div class="subtitulo" style="margin-bottom:4px">Entre com sua conta</div>
  <div class="empty login-erro" [hidden]="!erro()">{{ erro() }}</div>
  <app-campo rotulo="E-mail">
    <input class="input" type="email" placeholder="seu@email.com" autocomplete="username" [value]="email()" (input)="email.set(valorDe($event))">
  </app-campo>
  <app-campo rotulo="Senha">
    <input class="input" type="password" placeholder="Senha" autocomplete="current-password" [value]="senha()"
           (input)="senha.set(valorDe($event))" (keydown.enter)="entrar()">
  </app-campo>
  <button type="button" class="btn btn-primary btn-block" [disabled]="ocupado()" (click)="entrar()">Entrar</button>

  <section class="demo-login login-demo" aria-labelledby="tituloDemo">
    <h3 id="tituloDemo" class="secao" style="margin:0">Quer conhecer o sistema?</h3>
    <p>
      Abra uma demonstração com dados fictícios. Ela fica separada dos dados reais e é apagada depois de 2 horas.
    </p>
    <div class="empty login-erro" [hidden]="!erroDemo()">{{ erroDemo() }}</div>
    <button type="button" class="btn btn-secondary btn-block" [disabled]="ocupado()" (click)="abrirDemonstracao()">Abrir demonstração</button>
  </section>
</div>
