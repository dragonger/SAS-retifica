<div style="max-width:340px;margin:60px auto 0;display:flex;flex-direction:column;gap:14px">
  <h2 class="titulo">Retífica</h2>
  <div class="subtitulo">Entre com sua conta</div>
  <div class="empty" [hidden]="!erro()" style="color:#a4453f;padding:0;text-align:left;margin-bottom:4px">{{ erro() }}</div>
  <app-campo rotulo="E-mail">
    <input class="input" type="email" placeholder="seu@email.com" autocomplete="username" [value]="email()" (input)="email.set(valorDe($event))">
  </app-campo>
  <app-campo rotulo="Senha">
    <input class="input" type="password" placeholder="Senha" autocomplete="current-password" [value]="senha()"
           (input)="senha.set(valorDe($event))" (keydown.enter)="entrar()">
  </app-campo>
  <button type="button" class="btn btn-primary btn-block" (click)="entrar()">Entrar</button>
</div>
