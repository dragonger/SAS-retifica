@if (abertos() !== null) {
  <div class="topo-lista">
    <span class="subtitulo">{{ subtitulo() }}</span>
    <button type="button" class="btn btn-primary btn-compacto" (click)="novoPedido()">Novo pedido</button>
  </div>

  @if (filtro()) {
    <button type="button" class="btn btn-secondary btn-block espaco-abaixo" (click)="verTodos()">Ver todos os pedidos</button>
  }

  <app-secao-rascunhos />
  <div class="filtros-lista">
    <input class="input" type="search" aria-label="Buscar pedido" placeholder="Cliente, modelo ou nº…"
           [value]="busca()" (input)="busca.set(valorDe($event))">
    <select class="input" aria-label="Filtrar por cliente" (change)="escolherCliente($event)">
      <option value="" [selected]="clienteSel() === ''">Todos os clientes</option>
      @if (clienteCarregando()) {
        <option [value]="clienteSel()" selected>Carregando…</option>
      }
      @for (c of clientesOrdenados(); track c.id) {
        <option [value]="c.id" [selected]="clienteSel() === '' + c.id">{{ c.nome }}</option>
      }
    </select>
  </div>

  <div>
    @if (!visiveis().length) {
      <div class="empty">{{ vazio() }}</div>
    } @else {
      @for (p of visiveis(); track p.id) {
        <app-linha-pedido [pedido]="p" />
      }
    }
    @if (finalizados().length) {
      <h2 class="secao">Finalizados</h2>
      @for (p of finalizados(); track p.id) {
        <app-linha-pedido [pedido]="p" />
      }
    }
  </div>

  @if (!filtro()) {
    <button type="button" class="btn btn-secondary btn-block espaco-acima" (click)="verFinalizados()">Ver finalizados</button>
  }
} @else {
  <div class="empty">Carregando…</div>
}
